services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: patent
      POSTGRES_PASSWORD: patent
      POSTGRES_DB: patent
    ports:
      - "5432:5432"
    volumes:
      - patent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patent -d patent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # BullMQ needs Redis 5+. Port 6380 avoids an older Redis that may already
  # own 6379. REDIS_URL should be redis://localhost:6380.
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  patent_pg:
